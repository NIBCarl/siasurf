<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiaSurf Skill Pre-assessment (Sample)</title>
<style>
:root{--bg:#eef5f4;--panel:#ffffff;--text:#10343a;--muted:#55727a;--line:#cfe0df;--accent:#0a6e8a;--on-accent:#ffffff;--ok:#1b7f4b;--warn:#a85a00;--bad:#b42318;--tint:#dcedf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1b1f;--panel:#132a30;--text:#e4f1f2;--muted:#94b3b8;--line:#24444b;--accent:#4cc3e3;--on-accent:#06222b;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--tint:#1a3a42}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1b1f;--panel:#132a30;--text:#e4f1f2;--muted:#94b3b8;--line:#24444b;--accent:#4cc3e3;--on-accent:#06222b;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--tint:#1a3a42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0 6px}
h2{font-size:1.05rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 6px}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:14px 0 22px}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 14px 8px;margin:0 0 16px}
legend{font-weight:700;padding:0 6px}
.sub{font-size:.85rem;color:var(--muted);margin:10px 0 2px;font-weight:600}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:8px;cursor:pointer}
label.opt:hover{background:var(--tint)}
input[type=checkbox],input[type=radio]{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.q{margin:0 0 14px}
.q p{margin:4px 0 4px;font-weight:600}
.req{color:var(--bad);font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.hint.err{color:var(--bad)}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 6px}
.bar div{padding:10px 4px;text-align:center;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:.9rem}
.bar div.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.result h1{margin-top:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row span:last-child{font-weight:700;text-align:right}
.flag{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--tint);border-left:4px solid var(--warn)}
ul.plain{margin:6px 0 0;padding-left:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var LV=["beginner","intermediate","advanced"];
var basic=["I can paddle a board on my own.","I can stand up on small, broken (white-water) waves."];
var inter=["I can paddle out past the breaking waves on my own.","I can catch unbroken (green) waves.","I can stand up in one motion and ride along the wave.","I can turn left and right while riding.","I can surf for about an hour without a long rest."];
var adv=["I surf regularly without an instructor.","I can surf waves taller than me with control.","I can make controlled turns and change direction quickly.","I can surf reef breaks and crowded lineups.","I can surf for two hours or more."];
var qs=[
{k:"Water safety",t:"You’re caught in a rip current. What should you do?",o:["Swim straight back to shore as fast as you can","Stay calm and swim parallel to the shore","Stay still and wait for it to stop","Swim against the current until it weakens"],a:1,req:true},
{k:"Surf etiquette",t:"Two surfers are riding the same wave. Who has priority?",o:["The surfer who paddled out first","The surfer closest to the breaking part of the wave","The surfer with the longer board","The surfer closer to the shore"],a:1},
{k:"Equipment",t:"What is a leash for?",o:["It keeps the board attached to you","It helps you paddle faster","It protects the fins","It keeps the board waxed"],a:0},
{k:"Surfing spots",t:"Why does the tide matter at a reef break?",o:["It changes the water color","The reef can be shallow at low tide","Waves stop at high tide","It changes the wind direction"],a:1}
];
var app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function checks(arr,name){return arr.map(function(t,i){return '<label class="opt"><input type="checkbox" name="'+name+'" value="'+i+'"><span>'+esc(t)+'</span></label>'}).join("")}
function form(){
  var h='<h1>Skill pre-assessment</h1><p class="lead">Answer honestly. Your level decides which instructors and surf zones you can book, and it keeps you safe in the water.</p>';
  h+='<p class="note">Intermediate needs all Basic items and 4 of 5 Intermediate items, plus 3 of 4 correct answers including the water safety question. Advanced needs 4 of 5 Advanced items and all 4 answers correct.</p>';
  h+='<form id="f" novalidate>';
  h+='<fieldset><legend>Part A. Basics</legend><label class="opt"><input type="checkbox" id="swim"><span>I can swim comfortably in deep water without a board.</span></label><label class="opt"><input type="checkbox" id="first"><span>This is my first time surfing, or I’m not sure of my level.</span></label></fieldset>';
  h+='<fieldset><legend>Part B. Tick the skills you can do</legend><p class="sub">Basic</p>'+checks(basic,"b")+'<p class="sub">Intermediate</p>'+checks(inter,"i")+'<p class="sub">Advanced</p>'+checks(adv,"a")+'</fieldset>';
  h+='<fieldset><legend>Part C. Four short questions</legend>';
  qs.forEach(function(q,n){
    h+='<div class="q"><p>'+(n+1)+'. '+esc(q.k)+(q.req?' <span class="req">(required)</span>':'')+'<br><span style="font-weight:400">'+esc(q.t)+'</span></p>';
    q.o.forEach(function(o,j){h+='<label class="opt"><input type="radio" name="q'+n+'" value="'+j+'"><span>'+esc(o)+'</span></label>'});
    h+='</div>';
  });
  h+='</fieldset>';
  h+='<label class="opt"><input type="checkbox" id="conf"><span>I confirm that my answers are accurate.</span></label>';
  h+='<div class="actions"><button type="submit" id="go" disabled>See my level</button></div><p class="hint" id="msg">Answer the water safety question and confirm your answers to continue.</p></form>';
  app.innerHTML=h;
  var f=document.getElementById("f");
  function ready(){
    var q1=f.querySelector('input[name="q0"]:checked'),c=document.getElementById("conf").checked;
    document.getElementById("go").disabled=!(q1&&c);
    document.getElementById("msg").textContent=(q1&&c)?"":"Answer the water safety question and confirm your answers to continue.";
  }
  f.addEventListener("change",ready);
  f.addEventListener("submit",function(e){e.preventDefault();ready();if(!document.getElementById("go").disabled)score(f)});
}
function count(f,name){return f.querySelectorAll('input[name="'+name+'"]:checked').length}
function score(f){
  var swim=document.getElementById("swim").checked,first=document.getElementById("first").checked;
  var nb=count(f,"b"),ni=count(f,"i"),na=count(f,"a");
  var sk=0;
  if(nb===basic.length&&ni>=4){sk=1;if(na>=4)sk=2}
  var right=0,q1ok=false;
  qs.forEach(function(q,n){var c=f.querySelector('input[name="q'+n+'"]:checked');if(c&&+c.value===q.a){right++;if(n===0)q1ok=true}});
  var kn=0;
  if(right>=3&&q1ok){kn=1;if(right===4)kn=2}
  var fin=Math.min(sk,kn),flags=[];
  if(first){fin=0;flags.push("You said this is your first time or you’re not sure, so you start at beginner.")}
  if(!swim){fin=0;flags.push("Deep-water swimming was not confirmed. Your level is capped at beginner and the instructor sees a warning.")}
  if(!q1ok){fin=0;flags.push("The water safety question was answered incorrectly. Your level is capped at beginner and the instructor sees a warning.")}
  var inst=["Level 1, Level 2 or Level 3 instructors","Level 2 or Level 3 instructors","Level 3 instructors"][fin];
  var zones=["beginner zones only","beginner and intermediate zones","all zones"][fin];
  var h='<div class="result"><p class="lead">Your assessed level</p><h1>'+LV[fin].charAt(0).toUpperCase()+LV[fin].slice(1)+'</h1><div class="bar">'+LV.map(function(l,i){return '<div class="'+(i===fin?"on":"")+'">'+l+'</div>'}).join("")+'</div>';
  h+=flags.map(function(x){return '<div class="flag">'+esc(x)+'</div>'}).join("");
  h+='<div class="row"><span>Skills checklist</span><span>'+LV[sk]+'</span></div><div class="row"><span>Knowledge questions ('+right+' of 4 correct)</span><span>'+LV[kn]+'</span></div><div class="row"><span>Final level (the lower of the two, after safety rules)</span><span>'+LV[fin]+'</span></div>';
  h+='<h2 style="margin-top:20px">What you can book</h2><ul class="plain"><li>'+inst+'</li><li>You will see '+zones+'</li></ul>';
  h+='<h2 style="margin-top:20px">What the instructor sees</h2><ul class="plain"><li>Your level and the skills you ticked ('+(nb+ni+na)+' items)</li><li>Your four answers ('+right+' correct)</li><li>Any safety warning above</li><li>The instructor can lower your level for the lesson but not raise it</li></ul>';
  h+='<div class="actions"><button class="ghost" id="again">Retake the assessment</button></div><p class="hint">Sample scoring: intermediate needs all Basic items and 4 of 5 Intermediate items, plus 3 of 4 correct answers including the water safety question. Advanced needs 4 of 5 Advanced items and all 4 answers correct. The numbers are settings that SISA can change.</p></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("again").addEventListener("click",form);
}
form();
</script>
</body>
</html>
