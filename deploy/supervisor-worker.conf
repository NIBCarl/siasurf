; Copy to /etc/supervisor/conf.d/siasurf-worker.conf and replace __APP_DIR__
; with your CloudPanel site directory (e.g. /home/siasurf/htdocs/your-domain.com).

[program:siasurf-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=siasurf
numprocs=1
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stopwaitsecs=60
