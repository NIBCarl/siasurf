; Copy to /etc/supervisor/conf.d/siasurf-reverb.conf and replace __APP_DIR__
; with your CloudPanel site directory (e.g. /home/siasurf/htdocs/your-domain.com).

[program:siasurf-reverb]
process_name=%(program_name)s
command=php __APP_DIR__/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=siasurf
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/reverb.log
